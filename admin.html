<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERIALARC — Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e8e8e8;min-height:100vh;transition:background 0.4s,color 0.4s;}
    body:not(.dark-mode){background:#f5f5f5;color:#1a1a1a;}

    nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(10,10,10,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;}
    body:not(.dark-mode) nav{background:rgba(245,245,245,0.9);border-color:rgba(0,0,0,0.06);}
    .logo{display:flex;align-items:center;text-decoration:none;}
    .logo-img{height:32px;}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .mode-btn{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:inherit;}
    body:not(.dark-mode) .mode-btn{border-color:rgba(0,0,0,0.1);color:#666;}
    .mode-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
    .mode-btn.active{background:#fff;color:#111;}
    body:not(.dark-mode) .mode-btn.active{background:#1a1a1a;color:#fff;}
    .admin-logout{padding:6px 12px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);background:transparent;color:#ef4444;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:inherit;}
    .admin-logout:hover{background:rgba(239,68,68,0.1);}

    .wrap{max-width:1100px;margin:0 auto;padding:32px 24px;}

    /* ── Login ── */
    .login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:1;transition:opacity 0.4s;}
    .login-overlay.hidden{opacity:0;pointer-events:none;}
    .login-box{width:100%;max-width:400px;background:#141414;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px 32px;animation:popIn 0.4s cubic-bezier(.25,.8,.25,1);}
    body:not(.dark-mode) .login-box{background:#fff;border-color:rgba(0,0,0,0.08);box-shadow:0 16px 48px rgba(0,0,0,0.1);}
    @keyframes popIn{from{opacity:0;transform:scale(0.92) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
    .login-box h2{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center;}
    .login-box .sub{font-size:13px;color:#888;text-align:center;margin-bottom:28px;}
    .login-box label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#ccc;}
    body:not(.dark-mode) .login-box label{color:#444;}
    .login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8e8e8;font-size:14px;font-family:inherit;outline:none;transition:all 0.3s;margin-bottom:16px;}
    body:not(.dark-mode) .login-box input{border-color:rgba(0,0,0,0.12);background:rgba(0,0,0,0.02);color:#1a1a1a;}
    .login-box input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,0.15);}
    .login-box .btn-submit{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.3s;}
    .login-box .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(168,85,247,0.3);}
    .login-error{color:#ef4444;font-size:13px;text-align:center;margin-top:12px;display:none;}
    .login-error.show{display:block;animation:shake 0.3s ease;}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

    /* ── Dashboard ── */
    .dash{display:none;}
    .dash.active{display:block;}

    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px;}
    .stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px;transition:all 0.3s;}
    body:not(.dark-mode) .stat{background:#fff;border-color:rgba(0,0,0,0.06);box-shadow:0 2px 12px rgba(0,0,0,0.04);}
    .stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.1);}
    .stat .label{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
    body:not(.dark-mode) .stat .label{color:#888;}
    .stat .value{font-size:28px;font-weight:800;letter-spacing:-0.5px;}
    .stat .value.purple{color:#a855f7;}

    .tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
    .tab{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:inherit;}
    body:not(.dark-mode) .tab{border-color:rgba(0,0,0,0.08);color:#666;}
    .tab:hover{background:rgba(255,255,255,0.06);}
    .tab.active{background:rgba(168,85,247,0.15);color:#a855f7;border-color:rgba(168,85,247,0.3);}

    .panel{display:none;}
    .panel.active{display:block;}

    .order-list{display:flex;flex-direction:column;gap:12px;}
    .order-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:all 0.3s;}
    body:not(.dark-mode) .order-card{background:#fff;border-color:rgba(0,0,0,0.06);box-shadow:0 2px 8px rgba(0,0,0,0.03);}
    .order-card:hover{border-color:rgba(168,85,247,0.2);}
    .order-info{flex:1;min-width:0;}
    .order-name{font-weight:700;font-size:15px;margin-bottom:4px;}
    .order-meta{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    body:not(.dark-mode) .order-meta{color:#888;}
    .order-right{text-align:right;flex-shrink:0;}
    .order-price{font-size:18px;font-weight:800;color:#a855f7;margin-bottom:4px;}
    .order-time{font-size:11px;color:#666;}
    .order-status{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-top:6px;}
    .order-status.pending{background:rgba(251,191,36,0.15);color:#fbbf24;}
    .order-status.completed{background:rgba(34,197,94,0.15);color:#22c55e;}
    .order-status.cancelled{background:rgba(239,68,68,0.15);color:#ef4444;}

    .empty{text-align:center;padding:60px 20px;color:#555;}
    .empty h3{font-size:18px;margin-bottom:8px;color:#888;}
    .empty p{font-size:13px;}

    .emp-form{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
    .emp-form input{padding:10px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8e8e8;font-size:13px;font-family:inherit;outline:none;transition:all 0.3s;}
    body:not(.dark-mode) .emp-form input{border-color:rgba(0,0,0,0.12);background:rgba(0,0,0,0.02);color:#1a1a1a;}
    .emp-form input:focus{border-color:#a855f7;}
    .emp-form .btn-add{padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.3s;}
    .emp-form .btn-add:hover{transform:translateY(-1px);}

    .emp-list{display:flex;flex-direction:column;gap:8px;}
    .emp-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;}
    body:not(.dark-mode) .emp-row{background:#fff;border-color:rgba(0,0,0,0.06);}
    .emp-email{font-weight:600;font-size:14px;}
    .emp-del{padding:5px 10px;border:none;border-radius:6px;background:rgba(239,68,68,0.1);color:#ef4444;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
    .emp-del:hover{background:rgba(239,68,68,0.2);}

    .search-bar{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#e8e8e8;font-size:14px;font-family:inherit;outline:none;margin-bottom:20px;transition:all 0.3s;}
    body:not(.dark-mode) .search-bar{border-color:rgba(0,0,0,0.1);background:rgba(0,0,0,0.02);color:#1a1a1a;}
    .search-bar:focus{border-color:#a855f7;}

    @media(max-width:600px){
      .wrap{padding:20px 16px;}
      .order-card{flex-direction:column;align-items:flex-start;}
      .order-right{text-align:left;}
      .emp-form{flex-direction:column;}
    }
  </style>
</head>
<body class="dark-mode">

  <nav>
    <a href="index.html" class="logo"><img src="aerialarc.png" alt="AERIALARC" class="logo-img"></a>
    <div class="nav-right">
      <button id="lightModeBtn" class="mode-btn">Light</button>
      <button id="darkModeBtn" class="mode-btn">Dark</button>
      <button class="admin-logout" id="logoutBtn" style="display:none;">Log Out</button>
      <span id="adminName" style="font-size:13px;font-weight:600;color:#a855f7;margin-left:4px;"></span>
    </div>
  </nav>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>Admin Access</h2>
      <p class="sub">Employee login to view orders</p>
      <div class="login-error" id="loginError">Invalid credentials</div>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="employee@aerialarc.com">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Password">
      <button class="btn-submit" id="loginBtn">Log In</button>
    </div>
  </div>

  <div class="dash" id="dashboard">
    <div class="wrap">
      <div class="stats">
        <div class="stat"><div class="label">Total Orders</div><div class="value" id="statTotal">0</div></div>
        <div class="stat"><div class="label">Pending</div><div class="value purple" id="statPending">0</div></div>
        <div class="stat"><div class="label">Completed</div><div class="value" id="statCompleted">0</div></div>
        <div class="stat"><div class="label">Revenue</div><div class="value purple" id="statRevenue">$0</div></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="orders">Orders</button>
        <button class="tab" data-tab="employees">Employees</button>
      </div>

      <div class="panel active" id="panel-orders">
        <input type="text" class="search-bar" id="searchBar" placeholder="Search orders by name, email, or meta...">
        <div class="order-list" id="orderList"></div>
      </div>

      <div class="panel" id="panel-employees">
        <div class="emp-form">
          <input type="text" id="newEmpFirst" placeholder="First name">
          <input type="text" id="newEmpLast" placeholder="Last name">
          <input type="email" id="newEmpEmail" placeholder="Employee email">
          <input type="password" id="newEmpPass" placeholder="Password">
          <button class="btn-add" id="addEmpBtn">Add Employee</button>
        </div>
        <div class="emp-list" id="empList"></div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    var EMP_KEY='aerialarc_employees';
    var ORD_KEY='aerialarc_orders';
    var SESS_KEY='aerialarc_admin_session';

    // Default admin
    var OWNER_EMAIL='mohammedfortrade777@gmail.com';
    function isOwner(){return localStorage.getItem(SESS_KEY)===OWNER_EMAIL;}
    function getEmployees(){
      var defaults=[{email:'mohammedfortrade777@gmail.com',pass:'00112233Ff#',first:'Mohammed',last:'Owner'}];
      var raw=localStorage.getItem(EMP_KEY);
      if(!raw){
        localStorage.setItem(EMP_KEY,JSON.stringify(defaults));
        return defaults;
      }
      var list=JSON.parse(raw);
      var hasOwner=list.some(function(e){return e.email.toLowerCase()===OWNER_EMAIL.toLowerCase();});
      if(!hasOwner){
        list.push(defaults[0]);
        localStorage.setItem(EMP_KEY,JSON.stringify(list));
      }
      return list;
    }

    function saveEmployees(list){localStorage.setItem(EMP_KEY,JSON.stringify(list));}
    function getOrders(){try{return JSON.parse(localStorage.getItem(ORD_KEY)||'[]');}catch(e){return[];}}
    function saveOrders(list){localStorage.setItem(ORD_KEY,JSON.stringify(list));}

    // Theme
    var body=document.body;
    var lightBtn=document.getElementById('lightModeBtn');
    var darkBtn=document.getElementById('darkModeBtn');
    var logo=document.querySelector('.logo-img');
    function setTheme(dark){
      if(dark){body.classList.add('dark-mode');if(logo)logo.src='aerialarc.png';}
      else{body.classList.remove('dark-mode');if(logo)logo.src='aerialarc2.png';}
    }
    lightBtn.addEventListener('click',function(){setTheme(false);localStorage.setItem('aerialarc_theme','light');});
    darkBtn.addEventListener('click',function(){setTheme(true);localStorage.setItem('aerialarc_theme','dark');});
    var saved=localStorage.getItem('aerialarc_theme');
    setTheme(saved!=='light');

    // Login
    var loginOverlay=document.getElementById('loginOverlay');
    var dashboard=document.getElementById('dashboard');
    var loginError=document.getElementById('loginError');
    var logoutBtn=document.getElementById('logoutBtn');
    var loggedUser=localStorage.getItem(SESS_KEY);

    function showDashboard(name){
      loginOverlay.classList.add('hidden');
      dashboard.style.display='block';
      logoutBtn.style.display='inline-flex';
      if(name){
        var nameEl=document.getElementById('adminName');
        if(nameEl)nameEl.textContent=name;
      }
    }
    function showLogin(){loginOverlay.classList.remove('hidden');dashboard.style.display='none';logoutBtn.style.display='none';var n=document.getElementById('adminName');if(n)n.textContent='';}

    if(loggedUser){
      var emps=getEmployees();
      var me=emps.find(function(e){return e.email.toLowerCase()===loggedUser.toLowerCase();});
      showDashboard(me?(me.first+' '+me.last):'');
    }

    document.getElementById('loginBtn').addEventListener('click',function(){
      var email=document.getElementById('loginEmail').value.trim().toLowerCase();
      var pass=document.getElementById('loginPass').value;
      var emps=getEmployees();
      var found=emps.find(function(e){return e.email.toLowerCase()===email&&e.pass===pass;});
      if(found){
        localStorage.setItem(SESS_KEY,email);
        loginError.classList.remove('show');
        showDashboard((found.first||'')+' '+(found.last||''));
        renderAll();
      }else{
        loginError.classList.add('show');
      }
    });

    document.getElementById('loginPass').addEventListener('keydown',function(e){
      if(e.key==='Enter')document.getElementById('loginBtn').click();
    });

    logoutBtn.addEventListener('click',function(){
      localStorage.removeItem(SESS_KEY);
      showLogin();
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
        document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
        tab.classList.add('active');
        document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
      });
    });

    // Orders
    function renderOrders(filter){
      var orders=getOrders();
      var list=document.getElementById('orderList');
      if(!orders.length){list.innerHTML='<div class="empty"><h3>No orders yet</h3><p>Orders will appear here when customers complete checkout.</p></div>';return;}
      if(filter){
        var f=filter.toLowerCase();
        orders=orders.filter(function(o){
          return (o.customer||'').toLowerCase().includes(f)||(o.email||'').toLowerCase().includes(f)||(o.items||'').toLowerCase().includes(f)||(o.meta||'').toLowerCase().includes(f);
        });
      }
      orders.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});
      var html='';
      orders.forEach(function(o){
        var t=o.timestamp?new Date(o.timestamp):new Date();
        var timeStr=t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' '+t.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
        var status=o.status||'pending';
        html+='<div class="order-card">';
        html+='<div class="order-info">';
        html+='<div class="order-name">'+(o.customer||'Guest')+'</div>';
        html+='<div class="order-meta">'+(o.email||'No email')+' &bull; '+(o.items||'Unknown item')+'</div>';
        if(o.meta)html+='<div class="order-meta" style="margin-top:2px;">'+o.meta+'</div>';
        html+='</div>';
        html+='<div class="order-right">';
        html+='<div class="order-price">$'+Number(o.total||0).toFixed(2)+'</div>';
        html+='<div class="order-time">'+timeStr+'</div>';
        html+='<div class="order-status '+status+'">'+status.charAt(0).toUpperCase()+status.slice(1)+'</div>';
        html+='</div></div>';
      });
      list.innerHTML=html;
    }

    function renderStats(){
      var orders=getOrders();
      var total=orders.length;
      var pending=orders.filter(function(o){return o.status==='pending';}).length;
      var completed=orders.filter(function(o){return o.status==='completed';}).length;
      var revenue=orders.filter(function(o){return o.status!=='cancelled';}).reduce(function(s,o){return s+Number(o.total||0);},0);
      document.getElementById('statTotal').textContent=total;
      document.getElementById('statPending').textContent=pending;
      document.getElementById('statCompleted').textContent=completed;
      document.getElementById('statRevenue').textContent='$'+revenue.toFixed(2);
    }

    document.getElementById('searchBar').addEventListener('input',function(){renderOrders(this.value);});

    // Employees
    function renderEmployees(){
      var emps=getEmployees();
      var list=document.getElementById('empList');
      var owner=isOwner();
      var html='';
      emps.forEach(function(e){
        var name=(e.first||'')+' '+(e.last||'');
        var isOwn=e.email.toLowerCase()===OWNER_EMAIL.toLowerCase();
        html+='<div class="emp-row"><span class="emp-email">'+name.trim()+'</span>';
        if(owner&&!isOwn){
          html+='<button class="emp-del" data-email="'+e.email+'">Remove</button>';
        }
        html+='</div>';
      });
      list.innerHTML=html;
      list.querySelectorAll('.emp-del').forEach(function(btn){
        btn.addEventListener('click',function(){
          if(!isOwner())return;
          var emps=getEmployees().filter(function(e){return e.email!==btn.dataset.email;});
          saveEmployees(emps);
          renderEmployees();
        });
      });
    }

    document.getElementById('addEmpBtn').addEventListener('click',function(){
      if(!isOwner())return;
      var first=document.getElementById('newEmpFirst').value.trim();
      var last=document.getElementById('newEmpLast').value.trim();
      var email=document.getElementById('newEmpEmail').value.trim();
      var pass=document.getElementById('newEmpPass').value;
      if(!email||!pass||!first)return;
      var emps=getEmployees();
      if(emps.find(function(e){return e.email.toLowerCase()===email.toLowerCase();})){return;}
      emps.push({email:email,pass:pass,first:first,last:last});
      saveEmployees(emps);
      document.getElementById('newEmpFirst').value='';
      document.getElementById('newEmpLast').value='';
      document.getElementById('newEmpEmail').value='';
      document.getElementById('newEmpPass').value='';
      renderEmployees();
    });

    function renderAll(){renderStats();renderOrders();renderEmployees();}
    renderAll();
  })();
  </script>
</body>
</html>
