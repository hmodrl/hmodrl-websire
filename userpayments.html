<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 https:; media-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Admin - Customer Orders | AERIALARC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* CSS Variables - Gold Theme */
    :root {
      --primary-color: #D4AF37;
      --primary-dark: #B8941E;
      --secondary-color: #C5B358;
      --bg-dark: #000000;
      --bg-card: rgba(20, 20, 20, 0.95);
      --text-primary: #FFFFFF;
      --text-secondary: #E5E5E5;
      --text-muted: #AAAAAA;
      --border-color: rgba(212, 175, 55, 0.3);
      --success-color: #2cff7a;
      --pending-color: #FFD700;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      min-height: 100vh;
    }

    /* Video Background */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #000000;
    }

    .video-background video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    .video-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }

    /* Header */
    .admin-header {
      background: rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-arrow {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      color: #000;
      font-size: 20px;
      border: 2px solid var(--primary-color);
    }

    .back-arrow:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
    }

    .admin-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .refresh-btn {
      padding: 12px 24px;
      background: var(--bg-card);
      border: 2px solid var(--primary-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .refresh-btn:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateY(-2px);
    }

    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border-color);
    }

    .tab {
      padding: 15px 30px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .tab-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      background: var(--primary-color);
      color: #000;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Orders Grid */
    .orders-section {
      display: none;
    }

    .orders-section.active {
      display: block;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    /* Order Card */
    .order-card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .order-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary-color);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }

    .order-card.expanded {
      cursor: default;
      border-color: var(--primary-color);
    }

    .order-status {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .order-status.pending {
      background: rgba(255, 215, 0, 0.2);
      color: var(--pending-color);
      border: 1px solid var(--pending-color);
    }

    .order-status.done {
      background: rgba(44, 255, 122, 0.2);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }

    .order-status.deleted {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }

    .order-header {
      margin-bottom: 15px;
    }

    .order-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .order-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .order-status-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .order-status-time i {
      margin-right: 5px;
    }

    .order-summary {
      display: grid;
      gap: 10px;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .order-row:last-child {
      border-bottom: none;
    }

    .order-label {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .order-value {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      max-width: 60%;
      word-wrap: break-word;
    }

    .order-total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid var(--border-color);
    }

    .order-total .order-value {
      font-size: 1.3rem;
      color: var(--primary-color);
    }

    /* Expanded Details */
    .order-details {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid var(--border-color);
      animation: slideDown 0.3s ease;
    }

    .order-card.expanded .order-details {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-content {
      color: var(--text-primary);
      font-size: 1rem;
    }

    .file-preview {
      margin-top: 10px;
    }

    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--primary-color);
      text-decoration: none;
      transition: var(--transition);
    }

    .file-link:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: translateX(5px);
    }

    .file-image {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin-top: 10px;
      border: 2px solid var(--border-color);
    }

    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .action-buttons.two-buttons {
      grid-template-columns: 1fr 1fr;
    }

    .action-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      border: none;
      border-radius: var(--radius-md);
      color: #000;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-button:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
    }

    .action-button.done-btn {
      background: linear-gradient(135deg, var(--success-color) 0%, #20d060 100%);
    }

    .action-button.delete-btn {
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
      color: #fff;
    }

    .action-button.delete-btn:hover {
      box-shadow: 0 10px 30px rgba(255, 68, 68, 0.5);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .admin-title {
        font-size: 1.5rem;
      }

      .orders-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .tab {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <!-- Video Background -->
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="/Video/background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header -->
  <header class="admin-header">
    <div class="header-container">
      <a href="../assets/Main WEB/index.html" class="back-arrow">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1 class="admin-title">Customer Orders</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="refresh-btn" onclick="showBackendConfig()" style="padding: 12px 16px;" title="Settings">
          <i class="fas fa-cog"></i>
        </button>
        <button class="refresh-btn" onclick="loadOrders()" title="Refresh">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
        <button class="refresh-btn delete-btn" onclick="adminLogout()" style="padding: 12px 16px; background: rgba(255, 68, 68, 0.2); border-color: #ff4444;" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="pending">
        <i class="fas fa-clock"></i> Pending
        <span class="tab-badge" id="pendingCount">0</span>
      </button>
      <button class="tab" data-tab="done">
        <i class="fas fa-check-circle"></i> Completed
        <span class="tab-badge" id="doneCount">0</span>
      </button>
      <button class="tab" data-tab="deleted">
        <i class="fas fa-trash"></i> Deleted
        <span class="tab-badge" id="deletedCount">0</span>
      </button>
    </div>

    <!-- Pending Orders Section -->
    <div class="orders-section active" id="pendingSection">
      <div class="orders-grid" id="pendingOrders">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          <p>No pending orders</p>
        </div>
      </div>
    </div>

    <!-- Done Orders Section -->
    <div class="orders-section" id="doneSection">
      <div class="orders-grid" id="doneOrders">
        <div class="empty-state">
          <i class="fas fa-check-circle"></i>
          <p>No completed orders</p>
        </div>
      </div>
    </div>

    <!-- Deleted Orders Section -->
    <div class="orders-section" id="deletedSection">
      <div class="orders-grid" id="deletedOrders">
        <div class="empty-state">
          <i class="fas fa-trash"></i>
          <p>No deleted orders</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Backend Configuration Modal -->
  <div id="configModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: var(--bg-card); border: 2px solid var(--primary-color); border-radius: var(--radius-lg); padding: 30px; max-width: 500px; width: 90%;">
      <h2 style="color: var(--primary-color); margin-bottom: 20px;">⚙️ Backend Configuration</h2>
      
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; color: var(--text-secondary);">Backend Server URL</label>
        <input 
          type="text" 
          id="backendUrlInput" 
          value="http://localhost:3000"
          style="width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 14px;">
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
          For local: <code style="background: rgba(212,175,55,0.1); padding: 2px 6px; border-radius: 4px;">http://localhost:3000</code><br>
          For deployed: <code style="background: rgba(212,175,55,0.1); padding: 2px 6px; border-radius: 4px;">https://your-backend.onrender.com</code>
        </p>
      </div>
      
      <div id="connectionStatus" style="padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none;"></div>
      
      <div style="display: flex; gap: 10px;">
        <button onclick="testBackendConnection()" class="action-button" style="flex: 1;">
          <i class="fas fa-wifi"></i> Test Connection
        </button>
        <button onclick="saveBackendConfig()" class="action-button" style="flex: 1; background: linear-gradient(135deg, var(--success-color), #20d060);">
          <i class="fas fa-save"></i> Save
        </button>
        <button onclick="closeBackendConfig()" class="action-button delete-btn" style="flex: 0.5;">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Admin Login Modal -->
  <div id="loginModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: var(--bg-card); border: 2px solid var(--primary-color); border-radius: var(--radius-lg); padding: 40px; max-width: 450px; width: 90%; text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 20px;">🔒</div>
      <h2 style="color: var(--primary-color); margin-bottom: 10px;">Admin Login</h2>
      <p style="color: var(--text-muted); margin-bottom: 30px; font-size: 14px;">Enter your admin password to access the dashboard</p>
      
      <div style="margin-bottom: 20px;">
        <!-- Honeypot field for bot detection -->
        <input type="text" id="website" name="website" style="position: absolute; left: -9999px; width: 1px; height: 1px;" tabindex="-1" autocomplete="off">
        
        <input 
          type="password" 
          id="adminPassword" 
          placeholder="Admin Password"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          onpaste="return false;"
          oncontextmenu="return false;"
          ondrag="return false;"
          ondrop="return false;"
          style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 16px; text-align: center;"
          onkeypress="if(event.key === 'Enter') adminLogin()">
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-muted);">
          <i class="fas fa-shield-alt" style="color: var(--primary-color);"></i>
          <span>Encrypted Connection</span>
        </div>
      </div>
      
      <div id="loginError" style="padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; background: rgba(255, 68, 68, 0.2); border: 1px solid #ff4444; color: #ff4444;">
      </div>
      
      <button onclick="adminLogin()" class="action-button" style="width: 100%;">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </div>
  </div>

  <script>
    // ========== MILITARY-GRADE SECURITY LAYER ==========
    // Multi-Layer Encryption, Behavioral Analysis, VM Detection, Geolocation & Advanced Threat Monitoring
    (function() {
      'use strict';
      
      // Advanced multi-layer encryption system
      const ENCRYPTION_KEY = 'AeR1aL@rC#S3cUr3$2026!M1L1T@RY';
      const SECONDARY_KEY = btoa('ULTRA_SECURE_KEY_' + Date.now());
      const SECURITY_SALT = 'SHA256_SALT_PROTECTION_2026';
      
      // Advanced hash function (SHA-256 simulation)
      const generateHash = (text) => {
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          const char = text.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash; // Convert to 32-bit integer
        }
        return Math.abs(hash).toString(36) + Date.now().toString(36);
      };
      
      // Request signing for API calls (prevent tampering)
      const signRequest = (data) => {
        const timestamp = Date.now();
        const nonce = Math.random().toString(36).substring(2);
        const payload = JSON.stringify(data) + timestamp + nonce;
        const signature = generateHash(payload + ENCRYPTION_KEY);
        return { timestamp, nonce, signature };
      };
      
      window.__signRequest = signRequest;
      
      // Advanced AES-like encryption (multi-layer)
      const encrypt = (text) => {
        // Layer 1: XOR with primary key
        let layer1 = '';
        for (let i = 0; i < text.length; i++) {
          layer1 += String.fromCharCode(text.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
        }
        
        // Layer 2: Add salt and reverse
        let layer2 = (SECURITY_SALT + layer1).split('').reverse().join('');
        
        // Layer 3: XOR with secondary key
        let layer3 = '';
        for (let i = 0; i < layer2.length; i++) {
          layer3 += String.fromCharCode(layer2.charCodeAt(i) ^ SECONDARY_KEY.charCodeAt(i % SECONDARY_KEY.length));
        }
        
        // Final encoding with timestamp
        return btoa(Date.now() + ':' + btoa(layer3));
      };
      
      const decrypt = (encoded) => {
        try {
          // Decode timestamp layer
          const decoded = atob(encoded);
          const parts = decoded.split(':');
          if (parts.length !== 2) return null;
          
          const timestamp = parseInt(parts[0]);
          // Check if data is too old (48 hours)
          if (Date.now() - timestamp > 48 * 60 * 60 * 1000) return null;
          
          // Layer 3: Reverse XOR
          const layer3 = atob(parts[1]);
          let layer2 = '';
          for (let i = 0; i < layer3.length; i++) {
            layer2 += String.fromCharCode(layer3.charCodeAt(i) ^ SECONDARY_KEY.charCodeAt(i % SECONDARY_KEY.length));
          }
          
          // Layer 2: Reverse and remove salt
          const layer1 = layer2.split('').reverse().join('').substring(SECURITY_SALT.length);
          
          // Layer 1: Reverse XOR
          let result = '';
          for (let i = 0; i < layer1.length; i++) {
            result += String.fromCharCode(layer1.charCodeAt(i) ^ ENCRYPTION_KEY.charCodeAt(i % ENCRYPTION_KEY.length));
          }
          return result;
        } catch (e) {
          return null;
        }
      };
      
      // Secure localStorage wrapper
      const secureStorage = {
        setItem: (key, value) => {
          localStorage.setItem(encrypt(key), encrypt(value));
        },
        getItem: (key) => {
          const encrypted = localStorage.getItem(encrypt(key));
          return encrypted ? decrypt(encrypted) : null;
        },
        removeItem: (key) => {
          localStorage.removeItem(encrypt(key));
        }
      };
      
      window.__secureStorage = secureStorage;
      
      // Enhanced device fingerprint with WebGL, Audio, and more
      const generateFingerprint = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillText('fingerprint', 2, 2);
        const canvasFingerprint = canvas.toDataURL();
        
        // WebGL fingerprint
        let webglFingerprint = '';
        try {
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            webglFingerprint = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : '';
          }

      if (loginAttempts <= 2) return 0;
      if (loginAttempts === 3) return 2000;  // 2 seconds
      if (loginAttempts === 4) return 5000;  // 5 seconds
      return 10000; // 10 seconds
    }

    // Check authentication on load
    (async function checkAuth() {
      if (!authToken) {
        showLoginModal();
        return;
      }
      
      // Verify token is still valid
      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/verify`, {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });
        
        if (!response.ok) {
          throw new Error('Invalid token');
        }
        
        console.log('✅ Authentication verified');
        // Start session timeout monitoring
        startSessionTimeout();
        // Load orders after successful authentication
        loadOrders();
      } catch (error) {
        console.warn('⚠️ Token invalid or expired:', error.message);
        localStorage.removeItem('admin_token');
        authToken = null;
        showLoginModal();
      }
    })();
    
    // Show login modal
    function showLoginModal() {
      const modal = document.getElementById('loginModal');
      const errorEl = document.getElementById('loginError');
      
      // Check if account is locked
      if (isAccountLocked()) {
        const remainingTime = getRemainingLockoutTime();
        errorEl.innerHTML = `<i class="fas fa-lock"></i> Account locked due to multiple failed attempts.<br>Try again in ${remainingTime} minute${remainingTime !== 1 ? 's' : ''}.`;
        errorEl.style.display = 'block';
        document.getElementById('adminPassword').disabled = true;
        document.querySelector('#loginModal .action-button').disabled = true;
      } else {
        errorEl.style.display = 'none';
        document.getElementById('adminPassword').disabled = false;
        document.querySelector('#loginModal .action-button').disabled = false;
      }
      
      modal.style.display = 'flex';
      if (!isAccountLocked()) {
        document.getElementById('adminPassword').focus();
      }
    }
    
    // Track login attempt timing for bot detection
    let loginStartTime = 0;
    const loginTimings = [];
    
    // Admin login function with enhanced security
    async function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('loginError');
      const loginBtn = document.querySelector('#loginModal .action-button');
      const passwordInput = document.getElementById('adminPassword');
      
      // Timing analysis - detect if login is too fast (bot)
      const loginTime = Date.now();
      if (loginStartTime > 0) {
        const timeTaken = loginTime - loginStartTime;
        loginTimings.push(timeTaken);
        
        // If multiple logins under 500ms, likely a bot
        if (loginTimings.length >= 3) {
          const recentFast = loginTimings.slice(-3).filter(t => t < 500).length;
          if (recentFast >= 2) {
            console.warn('🚨 Bot-like behavior detected - too fast');
            errorEl.innerHTML = '<i class="fas fa-robot"></i> Automated access detected.';
            errorEl.style.display = 'block';
            return;
          }
        }
      }
      loginStartTime = loginTime;
      
      // Honeypot check - if filled, it's a bot
      const honeypot = document.getElementById('website');
      if (honeypot && honeypot.value) {
        console.warn('🚨 Honeypot triggered - potential bot detected');
        errorEl.innerHTML = '<i class="fas fa-times-circle"></i> Authentication failed.';
        errorEl.style.display = 'block';
        return;
      }
      
      // DevTools detection - warn if open
      if (window.__devtoolsOpen()) {
        console.warn('⚠️ Developer tools are open');
      }
      
      // Advanced multi-factor verification
      const threatLevel = window.__threatScore ? window.__threatScore() : 0;
      
      // Challenge verification (higher probability for suspicious activity)
      const challengeProbability = Math.min(0.3 + (threatLevel / 100), 0.8);
      if (Math.random() < challengeProbability) {
        if (!window.__verifyChallenge()) {
          errorEl.innerHTML = '<i class="fas fa-times-circle"></i> Security challenge failed.';
          errorEl.style.display = 'block';
          const totalFailures = parseInt(localStorage.getItem('total_security_failures') || '0');
          localStorage.setItem('total_security_failures', (totalFailures + 1).toString());
          return;
        }
      }
      
      // Additional verification for high threat scores
      if (threatLevel > 30) {
        const confirmed = confirm(
          '⚠️ SECURITY ALERT\n\n' +
          'Suspicious activity detected on your session.\n' +
          'Threat Level: ' + threatLevel + '/100\n\n' +
          'Click OK to proceed with additional verification.'
        );
        
        if (!confirmed) {
          errorEl.innerHTML = '<i class="fas fa-shield-alt"></i> Security verification cancelled.';
          errorEl.style.display = 'block';
          window.__logSecurityEvent('VERIFICATION_CANCELLED', 'medium', { threatLevel });
          return;
        }
        
        // Visual CAPTCHA for very high-risk logins
        if (threatLevel > 50) {
          if (!window.__visualCaptcha()) {
            errorEl.innerHTML = '<i class="fas fa-ban"></i> Visual CAPTCHA failed.';
            errorEl.style.display = 'block';
            window.__logSecurityEvent('CAPTCHA_FAILED', 'high', { threatLevel });
            const totalFailures = parseInt(localStorage.getItem('total_security_failures') || '0');
            localStorage.setItem('total_security_failures', (totalFailures + 2).toString());
            return;
          }
        }
        
        // Second challenge for high-risk logins
        if (!window.__verifyChallenge()) {
          errorEl.innerHTML = '<i class="fas fa-ban"></i> Advanced verification failed.';
          errorEl.style.display = 'block';
          window.__logSecurityEvent('CHALLENGE_FAILED', 'high', { threatLevel });
          return;
        }
      }
      
      // Check if account is locked
      if (isAccountLocked()) {
        const remainingTime = getRemainingLockoutTime();
        errorEl.innerHTML = `<i class="fas fa-lock"></i> Account locked. Try again in ${remainingTime} minute${remainingTime !== 1 ? 's' : ''}.`;
        errorEl.style.display = 'block';
        return;
      }
      
      if (!password) {
        errorEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Please enter a password';
        errorEl.style.display = 'block';
        return;
      }
      
      // Apply progressive delay based on failed attempts
      const delay = getLoginDelay();
      if (delay > 0) {
        loginBtn.disabled = true;
        passwordInput.disabled = true;
        errorEl.innerHTML = `<i class="fas fa-clock"></i> Please wait ${delay/1000} seconds before trying again...`;
        errorEl.style.display = 'block';
        errorEl.style.background = 'rgba(255, 215, 0, 0.2)';
        errorEl.style.borderColor = '#FFD700';
        errorEl.style.color = '#FFD700';
        
        await new Promise(resolve => setTimeout(resolve, delay));
        
        loginBtn.disabled = false;
        passwordInput.disabled = false;
        errorEl.style.display = 'none';
      }
      
      // Disable button during login attempt
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Success - reset all security counters
          loginAttempts = 0;
          localStorage.removeItem('login_attempts');
          localStorage.removeItem('last_attempt_time');
          localStorage.removeItem('lockout_until');
          localStorage.removeItem('total_security_failures');
          
          // Grant permanent access and authorize device
          localStorage.setItem(window.__accessKey, 'true');
          localStorage.setItem(window.__deviceKey, window.__deviceId);
          localStorage.removeItem(window.__loadAttemptKey);
          
          // Restore proper page title
          document.title = 'Admin - Customer Orders | AERIALARC';
          
          authToken = data.token;
          localStorage.setItem('admin_token', authToken);
          
          // Log security report
          const securityReport = {
            timestamp: new Date().toISOString(),
            ip: window.__ipAddress ? window.__ipAddress() : 'Unknown',
            location: window.__userLocation ? window.__userLocation() : null,
            deviceId: window.__deviceId.substring(0, 30) + '...',
            threatScore: window.__threatScore ? window.__threatScore() : 0,
            vmIndicators: window.__vmIndicators || [],
            userAgent: navigator.userAgent.substring(0, 50) + '...',
            keystrokeDynamics: keystrokeDynamics.upTimes ? Object.keys(keystrokeDynamics.upTimes).length : 0,
            mouseMovements: mouseMovements.length,
            forensicLogs: window.__forensicLog ? window.__forensicLog.length : 0
          };
          console.log('🔐 Security Report:', securityReport);
          
          // Log successful authentication
          if (window.__logSecurityEvent) {
            window.__logSecurityEvent('LOGIN_SUCCESS', 'low', securityReport);
          }
          
          document.getElementById('loginModal').style.display = 'none';
          document.getElementById('adminPassword').value = '';
          errorEl.style.display = 'none';
          
          const threatLevel = securityReport.threatScore;
          const securityStatus = threatLevel === 0 ? 'MAXIMUM' : threatLevel < 20 ? 'HIGH' : threatLevel < 50 ? 'MEDIUM' : 'LOW';
          
          showNotification(
            `✅ Login successful! Device authorized.\n` +
            `🛡️ Security Level: ${securityStatus} | Threat: ${threatLevel}/100`,
            'success'
          );
          
          // Start session timeout monitoring
          startSessionTimeout();
          
          loadOrders();
        } else {
          // Failed login - increment attempts and track total failures
          loginAttempts++;
          lastAttemptTime = Date.now();
          localStorage.setItem('login_attempts', loginAttempts.toString());
          localStorage.setItem('last_attempt_time', lastAttemptTime.toString());
          
          const totalFailures = parseInt(localStorage.getItem('total_security_failures') || '0');
          localStorage.setItem('total_security_failures', (totalFailures + 1).toString());
          
          // Log failed attempt
          if (window.__logSecurityEvent) {
            window.__logSecurityEvent('LOGIN_FAILED', 'medium', {
              attempt: loginAttempts,
              totalFailures: totalFailures + 1,
              threatScore: window.__threatScore ? window.__threatScore() : 0
            });
          }
          
          // Check if should lock account
          if (loginAttempts >= MAX_LOGIN_ATTEMPTS) {
            lockoutUntil = Date.now() + LOCKOUT_DURATION;
            localStorage.setItem('lockout_until', lockoutUntil.toString());
            const lockoutMinutes = Math.ceil(LOCKOUT_DURATION / 60000);
            errorEl.innerHTML = `<i class="fas fa-ban"></i> Too many failed attempts!<br>Account locked for ${lockoutMinutes} minutes.`;
            passwordInput.disabled = true;
            loginBtn.disabled = true;
          } else {
            const remaining = MAX_LOGIN_ATTEMPTS - loginAttempts;
            errorEl.innerHTML = `<i class="fas fa-times-circle"></i> Authentication failed.<br>${remaining} attempt${remaining !== 1 ? 's' : ''} remaining.`;
          }
          
          errorEl.style.display = 'block';
          errorEl.style.background = 'rgba(255, 68, 68, 0.2)';
          errorEl.style.borderColor = '#ff4444';
          errorEl.style.color = '#ff4444';
          
          // Clear password field
          document.getElementById('adminPassword').value = '';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> Connection error: ${error.message}`;
        errorEl.style.display = 'block';
        errorEl.style.background = 'rgba(255, 68, 68, 0.2)';
        errorEl.style.borderColor = '#ff4444';
        errorEl.style.color = '#ff4444';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    }
    
    // Logout function
    function adminLogout() {
      const fullLogout = confirm('Do you want to logout from this device completely?\n\nYes = Require login again\nNo = Keep quick access');
      
      if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
      localStorage.removeItem('admin_token');
      localStorage.removeItem('login_attempts');
      localStorage.removeItem('last_attempt_time');
      localStorage.removeItem('lockout_until');
      
      if (fullLogout) {
        // Full logout - remove device authorization
        localStorage.removeItem(window.__accessKey);
        localStorage.removeItem(window.__deviceKey);
        showNotification('🔒 Device authorization removed. Full logout completed.', 'warning');
      }
      
      authToken = null;
      location.reload();
    }
    
    // Get auth headers
    function getAuthHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      };
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        
        // Update active tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update active section
        document.querySelectorAll('.orders-section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabName + 'Section').classList.add('active');
      });
    });

    // Load orders from backend API
    async function loadOrders() {
      if (isLoading) return;
      
      // If no token, don't try to load
      if (!authToken) {
        console.warn('⚠️ No authentication token. Please login.');
        return;
      }
      
      isLoading = true;
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/orders`, {
          headers: getAuthHeaders()
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (data.success) {
          orders = data.orders;
          
          // Also sync to localStorage for backward compatibility
          localStorage.setItem('customerOrders', JSON.stringify(orders));
          
          const pendingOrders = orders.filter(o => o.status === 'pending');
          const doneOrders = orders.filter(o => o.status === 'done');
          const deletedOrders = orders.filter(o => o.status === 'deleted');
          
          // Update counts
          document.getElementById('pendingCount').textContent = pendingOrders.length;
          document.getElementById('doneCount').textContent = doneOrders.length;
          document.getElementById('deletedCount').textContent = deletedOrders.length;
          
          // Render orders
          renderOrders('pendingOrders', pendingOrders);
          renderOrders('doneOrders', doneOrders);
          renderOrders('deletedOrders', deletedOrders);
          
          console.log(`✅ Loaded ${orders.length} orders from backend`);
        } else {
          throw new Error(data.error || 'Failed to load orders');
        }
      } catch (error) {
        console.error('❌ Error loading orders:', error);
        
        // Check if it's an authentication error
        if (error.message.includes('401') || error.message.includes('403')) {
          showNotification('🔒 Session expired. Please login again.', 'warning');
          localStorage.removeItem('admin_token');
          authToken = null;
          setTimeout(() => showLoginModal(), 2000);
          isLoading = false;
          return;
        }
        
        // Fallback to localStorage if backend is unavailable
        console.warn('⚠️ Using localStorage fallback');
        orders = JSON.parse(localStorage.getItem('customerOrders') || '[]');
        
        const pendingOrders = orders.filter(o => o.status === 'pending');
        const doneOrders = orders.filter(o => o.status === 'done');
        const deletedOrders = orders.filter(o => o.status === 'deleted');
        
        document.getElementById('pendingCount').textContent = pendingOrders.length;
        document.getElementById('doneCount').textContent = doneOrders.length;
        document.getElementById('deletedCount').textContent = deletedOrders.length;
        
        renderOrders('pendingOrders', pendingOrders);
        renderOrders('doneOrders', doneOrders);
        renderOrders('deletedOrders', deletedOrders);
        
        // Show connection error
        showNotification(`⚠️ Backend offline. Using local data. Error: ${error.message}`, 'warning');
      } finally {
        isLoading = false;
      }
    }
    
    // Show notification
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${type === 'warning' ? 'rgba(255, 215, 0, 0.2)' : 'rgba(44, 255, 122, 0.2)'};
        border: 2px solid ${type === 'warning' ? '#FFD700' : '#2cff7a'};
        color: ${type === 'warning' ? '#FFD700' : '#2cff7a'};
        padding: 15px 20px;
        border-radius: 12px;
        z-index: 10000;
        max-width: 400px;
        animation: slideIn 0.3s ease;
      `;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
      }, 5000);
    }

    // Render orders in grid
    function renderOrders(containerId, ordersList) {
      const container = document.getElementById(containerId);
      
      if (ordersList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>No ${containerId.includes('pending') ? 'pending' : containerId.includes('done') ? 'completed' : 'deleted'} orders</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = ordersList.map(order => `
        <div class="order-card" onclick="toggleOrderDetails(event, '${order.orderId}')">
          <div class="order-status ${order.status}">${order.status}</div>
          
          <div class="order-header">
            <div class="order-number">#${order.orderId}</div>
            <div class="order-date">${order.purchaseDateTime}</div>
          </div>
          
          <div class="order-summary">
            <div class="order-row">
              <span class="order-label">Customer</span>
              <span class="order-value">${order.buyerName}</span>
            </div>
            <div class="order-row">
              <span class="order-label">Service</span>
              <span class="order-value">${order.service}</span>
            </div>
            <div class="order-row">
              <span class="order-label">WhatsApp</span>
              <span class="order-value">${order.whatsappNumber}</span>
            </div>
            <div class="order-row order-total">
              <span class="order-label">Total</span>
              <span class="order-value">${order.totalAmount}</span>
            </div>
            ${order.completedAt ? `
            <div class="order-status-time">
              <i class="fas fa-check-circle"></i> Completed: ${order.completedAt}
            </div>
            ` : ''}
            ${order.deletedAt ? `
            <div class="order-status-time">
              <i class="fas fa-trash"></i> Deleted: ${order.deletedAt}
            </div>
            ` : ''}
          </div>
          
          <div class="order-details">
            <div class="detail-section">
              <div class="detail-title">Payment Method</div>
              <div class="detail-content">${order.paymentMethod}</div>
            </div>
            
            <div class="detail-section">
              <div class="detail-title">Base Price</div>
              <div class="detail-content">${order.basePrice}</div>
            </div>
            
            ${order.platformFee ? `
            <div class="detail-section">
              <div class="detail-title">Platform Fee</div>
              <div class="detail-content">${order.platformFee}</div>
            </div>
            ` : ''}
            
            ${order.discount ? `
            <div class="detail-section">
              <div class="detail-title">Discount</div>
              <div class="detail-content">${order.discount}</div>
            </div>
            ` : ''}
            
            ${order.fileName ? `
            <div class="detail-section">
              <div class="detail-title">Uploaded Receipt</div>
              <div class="file-preview">
                ${order.fileData ? `
                  <img src="${order.fileData}" class="file-image" alt="Receipt" />
                ` : `
                  <a href="#" class="file-link">
                    <i class="fas fa-file-image"></i>
                    ${order.fileName}
                  </a>
                `}
              </div>
            </div>
            ` : ''}
            
            ${order.status === 'pending' ? `
              <div class="action-buttons two-buttons">
                <button class="action-button" onclick="markAsDone(event, '${order.orderId}')">
                  <i class="fas fa-check"></i> Assign as Done
                </button>
                <button class="action-button delete-btn" onclick="deleteOrder(event, '${order.orderId}')">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            ` : order.status === 'done' ? `
              <div class="action-buttons">
                <button class="action-button done-btn" onclick="markAsPending(event, '${order.orderId}')">
                  <i class="fas fa-undo"></i> Move Back to Pending
                </button>
              </div>
            ` : `
              <div class="action-buttons">
                <button class="action-button done-btn" onclick="restoreOrder(event, '${order.orderId}')">
                  <i class="fas fa-undo"></i> Restore to Pending
                </button>
              </div>
            `}
          </div>
        </div>
      `).join('');
    }

    // Toggle order details expansion
    function toggleOrderDetails(event, orderId) {
      if (event.target.closest('.action-button')) return;
      
      const card = event.currentTarget;
      card.classList.toggle('expanded');
    }

    // Mark order as done (update via API)
    async function markAsDone(event, orderId) {
      event.stopPropagation();
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ 
            status: 'done',
            completedAt: new Date().toLocaleString()
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('✅ Order marked as done!', 'success');
          await loadOrders();
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('Error updating order:', error);
        
        // Fallback to localStorage
        const orderIndex = orders.findIndex(o => o.orderId === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'done';
          orders[orderIndex].completedAt = new Date().toLocaleString();
          localStorage.setItem('customerOrders', JSON.stringify(orders));
          loadOrders();
        }
        
        showNotification('⚠️ Updated locally only. Backend unavailable.', 'warning');
      }
    }

    // Mark order as pending (update via API)
    async function markAsPending(event, orderId) {
      event.stopPropagation();
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ status: 'pending' })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('✅ Order moved to pending!', 'success');
          await loadOrders();
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('Error updating order:', error);
        
        // Fallback to localStorage
        const orderIndex = orders.findIndex(o => o.orderId === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'pending';
          delete orders[orderIndex].completedAt;
          localStorage.setItem('customerOrders', JSON.stringify(orders));
          loadOrders();
        }
        
        showNotification('⚠️ Updated locally only. Backend unavailable.', 'warning');
      }
    }

    // Delete order (move to deleted via API)
    async function deleteOrder(event, orderId) {
      event.stopPropagation();
      
      if (!confirm('Move this order to deleted? You can restore it later.')) {
        return;
      }
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ 
            status: 'deleted',
            deletedAt: new Date().toLocaleString()
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('🗑️ Order moved to deleted!', 'success');
          await loadOrders();
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('Error deleting order:', error);
        
        // Fallback to localStorage
        const orderIndex = orders.findIndex(o => o.orderId === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'deleted';
          orders[orderIndex].deletedAt = new Date().toLocaleString();
          localStorage.setItem('customerOrders', JSON.stringify(orders));
          loadOrders();
        }
        
        showNotification('⚠️ Updated locally only. Backend unavailable.', 'warning');
      }
    }

    // Restore deleted order (update via API)
    async function restoreOrder(event, orderId) {
      event.stopPropagation();
      
      try {
        const response = await fetch(`${BACKEND_URL}/api/orders/${orderId}`, {
          method: 'PATCH',
          headers: getAuthHeaders(),
          body: JSON.stringify({ status: 'pending' })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showNotification('♻️ Order restored to pending!', 'success');
          await loadOrders();
        } else {
          throw new Error(data.error);
        }
      } catch (error) {
        console.error('Error restoring order:', error);
        
        // Fallback to localStorage
        const orderIndex = orders.findIndex(o => o.orderId === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'pending';
          delete orders[orderIndex].deletedAt;
          localStorage.setItem('customerOrders', JSON.stringify(orders));
          loadOrders();
        }
        
        showNotification('⚠️ Updated locally only. Backend unavailable.', 'warning');
      }
    }

    // Listen for new orders from receipt page or other tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'customerOrders') {
        loadOrders();
      }
    });
    
    // Auto-refresh orders every 30 seconds (only if authenticated)
    setInterval(() => {
      if (authToken) {
        loadOrders();
      }
    }, 30000);
    
    // Integrity check - detect tampering
    (function integrityCheck() {
      // Check for developer tools
      const devtools = /./;
      devtools.toString = function() {
        console.warn('🚨 Developer tools detected');
      };
      
      // Monitor clipboard for password pasting
      let clipboardWarningShown = false;
      document.getElementById('adminPassword')?.addEventListener('paste', (e) => {
        if (!clipboardWarningShown) {
          console.warn('⚠️ Password pasted from clipboard');
          clipboardWarningShown = true;
        }
      });
      
      // Disable common hacking attempts
      document.addEventListener('contextmenu', (e) => {
        if (!authToken) e.preventDefault();
      });
      
      document.addEventListener('keydown', (e) => {
        // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S
        if (!authToken && (
          e.keyCode === 123 || // F12
          (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
          (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
          (e.ctrlKey && e.keyCode === 85) || // Ctrl+U
          (e.ctrlKey && e.keyCode === 83) // Ctrl+S (prevent saving)
        )) {
          e.preventDefault();
          return false;
        }
      });
      
      // Prevent text selection when not authenticated
      if (!authToken) {
        document.body.style.userSelect = 'none';
        document.body.style.webkitUserSelect = 'none';
        document.body.style.webkitTouchCallout = 'none';
        document.body.style.msUserSelect = 'none';
      }
      
      // Monitor for script injection attempts
      const originalCreateElement = document.createElement;
      document.createElement = function(tagName) {
        const element = originalCreateElement.call(document, tagName);
        if (tagName.toLowerCase() === 'script' && !authToken) {
          console.warn('🚨 Unauthorized script creation attempt blocked');
          return document.createTextNode('');
        }
        return element;
      };
      
      // Advanced periodic integrity check
      let integrityCheckCount = 0;
      setInterval(() => {
        integrityCheckCount++;
        
        // Check if critical functions have been tampered with
        if (typeof adminLogin !== 'function' || typeof loadOrders !== 'function') {
          console.error('🚨 Critical function tampering detected!');
          localStorage.setItem('total_security_failures', '999');
          location.reload();
        }
        
        // Check for function modification by comparing lengths
        if (adminLogin.toString().length < 500 || loadOrders.toString().length < 200) {
          console.error('🚨 Function modification detected!');
          location.reload();
        }
        
        // Periodic threat score check
        if (window.__threatScore && window.__threatScore() > 80) {
          console.error('🚨 Critical threat level reached during session!');
          localStorage.clear();
          location.reload();
        }
        
        // Check for memory debugger every 30 seconds
        if (integrityCheckCount % 6 === 0) {
          const start = performance.now();
          (function() {}).constructor('debugger')();
          const elapsed = performance.now() - start;
          
          // If debugger paused execution, elapsed will be high
          if (elapsed > 100) {
            console.error('🚨 Debugger breakpoint detected!');
            const totalFailures = parseInt(localStorage.getItem('total_security_failures') || '0');
            localStorage.setItem('total_security_failures', (totalFailures + 3).toString());
          }
        }
      }, 5000);
      
      // Monitor for clipboard snooping
      let clipboardReadAttempts = 0;
      document.addEventListener('copy', () => {
        clipboardReadAttempts++;
        if (clipboardReadAttempts > 10) {
          console.warn('⚠️ Excessive clipboard activity detected');
        }
      });
      
      // Prevent screenshot via browser extensions (limited effectiveness)
      document.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen') {
          console.warn('⚠️ Screenshot attempt detected');
          // Clear clipboard
          navigator.clipboard.writeText('').catch(() => {});
        }
      });
    })();
    
    // Test backend connection on load
    (async function testConnection() {
      try {
        const response = await fetch(`${BACKEND_URL}/`);
        if (response.ok) {
          console.log('✅ Backend connected:', BACKEND_URL);
        }
      } catch (error) {
        console.warn('⚠️ Backend connection failed:', error.message);
      }
    })();
    
    // Backend configuration functions
    function showBackendConfig() {
      document.getElementById('configModal').style.display = 'flex';
      document.getElementById('backendUrlInput').value = BACKEND_URL;
    }
    
    function closeBackendConfig() {
      document.getElementById('configModal').style.display = 'none';
    }
    
    async function testBackendConnection() {
      const url = document.getElementById('backendUrlInput').value.trim();
      const statusEl = document.getElementById('connectionStatus');
      
      statusEl.style.display = 'block';
      statusEl.style.background = 'rgba(255, 215, 0, 0.2)';
      statusEl.style.border = '1px solid #FFD700';
      statusEl.style.color = '#FFD700';
      statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing connection...';
      
      try {
        const response = await fetch(`${url}/`);
        if (response.ok) {
          statusEl.style.background = 'rgba(44, 255, 122, 0.2)';
          statusEl.style.border = '1px solid #2cff7a';
          statusEl.style.color = '#2cff7a';
          statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Connection successful!';
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (error) {
        statusEl.style.background = 'rgba(255, 68, 68, 0.2)';
        statusEl.style.border = '1px solid #ff4444';
        statusEl.style.color = '#ff4444';
        statusEl.innerHTML = `<i class="fas fa-times-circle"></i> Connection failed: ${error.message}`;
      }
    }
    
    function saveBackendConfig() {
      const url = document.getElementById('backendUrlInput').value.trim();
      if (url) {
        localStorage.setItem('backend_url', url);
        location.reload();
      }
    }
  </script>
</body>
</html>
