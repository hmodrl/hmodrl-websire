<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERIALARC • Rocket League Boosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* CSS Variables - Black, Grey & Gold Theme */
    :root {
      --primary-color: #D4AF37;
      --primary-dark: #B8941E;
      --secondary-color: #C5B358;
      --secondary-dark: #A89543;
      --accent-color: #FFD700;
      --accent-dark: #DAA520;
      --bg-dark: #000000;
      --bg-card: rgba(20, 20, 20, 0.95);
      --text-primary: #FFFFFF;
      --text-secondary: #E5E5E5;
      --text-muted: #AAAAAA;
      --border-color: rgba(212, 175, 55, 0.3);
      --shadow-primary: 0 10px 30px rgba(212, 175, 55, 0.25);
      --shadow-secondary: 0 10px 30px rgba(197, 179, 88, 0.25);
      --shadow-accent: 0 10px 30px rgba(255, 215, 0, 0.25);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      min-height: 100vh;
    }

    /* Video Background */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #000000;
    }

    .video-background video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    .video-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* Typography */
    h1 {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 50%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.15rem;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .lead {
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 60px;
      font-size: 1.3rem;
      text-align: center;
    }

    /* Back Arrow */
    .back-arrow {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: var(--transition);
      z-index: 1001;
      text-decoration: none;
      box-shadow: var(--shadow-primary);
      border: 2px solid rgba(212, 175, 55, 0.3);
    }

    .back-arrow:hover {
      transform: translateX(-8px) scale(1.1);
      box-shadow: 0 10px 40px rgba(212, 175, 55, 0.5);
      border-color: var(--primary-color);
    }

    /* Main Content */
    main {
      padding: 140px 20px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Cards Section */
    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 60px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 45px 35px;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), transparent 60%);
      opacity: 0;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: var(--shadow-primary);
      border-color: var(--primary-color);
    }

    .card:hover::before {
      opacity: 1;
    }

    .icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      font-size: 2.5rem;
      box-shadow: var(--shadow-primary);
      transition: var(--transition);
    }

    .card:hover .icon {
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
    }

    .card h2 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 15px;
      font-weight: 800;
    }

    .card p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 30px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: var(--transition);
      width: 100%;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-primary);
    }

    .btn i {
      transition: var(--transition);
    }

    .btn:hover i {
      transform: translateX(5px);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      animation: fadeInUp 0.8s ease 0.2s backwards;
    }

    .lead {
      animation: fadeInUp 0.8s ease 0.4s backwards;
    }

    .card {
      animation: fadeInUp 0.8s ease 0.6s backwards;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .back-arrow {
        top: 20px;
        left: 20px;
        width: 48px;
        height: 48px;
        font-size: 1.1rem;
      }

      main {
        padding: 100px 20px 60px;
      }

      .choices {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .card {
        padding: 35px 25px;
      }

      .icon {
        width: 75px;
        height: 75px;
        font-size: 2rem;
      }

      .lead {
        font-size: 1.1rem;
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>
<body>
  <!-- Video Background -->
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="/Video/background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Back Arrow -->
  <a href="../index.html" class="back-arrow" title="Back to Home">
    <i class="fas fa-arrow-left"></i>
  </a>

  <!-- Main Content -->
  <main class="container">
    <h1>Rocket League Boosting</h1>
    <p class="lead">Choose what you want to explore. Same AERIALARC design. Clean, fast, and focused.</p>

    <section class="choices">
      <!-- RANKS -->
      <div class="card" onclick="location.href='RLboostingRank.html'">
        <div class="icon"><i class="fas fa-chart-line"></i></div>
        <h2>Rocket League Ranks</h2>
        <p>View, calculate, or select Rocket League ranks with a clean and visual interface.</p>
        <a class="btn" href="RLboostingRank.html">
          <i class="fas fa-arrow-right"></i>
          Go to Ranks
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 AERIALARC • Rocket League Boosting Tools</p>
  </footer>
</body>
</html>
