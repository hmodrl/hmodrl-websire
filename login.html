<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERIALARC — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login dark-mode">
  <div class="bg-glow"></div>
  <nav>
    <a href="index.html" class="logo"><img src="aerialarc.png" alt="AERIALARC" class="logo-img"></a>
    <div class="nav-right">
      <button id="lightModeBtn" class="mode-btn">Light</button>
      <button id="darkModeBtn" class="mode-btn">Dark</button>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1 id="cardTitle">Welcome Back</h1>
      <p class="subtitle" id="cardSubtitle">Log in to your AERIALARC account</p>
      <div class="error-msg" id="errorMsg"></div>

      <div class="step active" id="step1">
        <form id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
          <div class="form-options">
            <label><input type="checkbox" id="rememberMe"> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Continue</span>
            <div class="spinner"></div>
          </button>
        </form>
        <div class="divider">or</div>
        <button class="btn-google" id="googleBtn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span>Sign in with Google</span>
        </button>
        <div class="signup-link">Don't have an account? <a href="#">Sign up</a></div>
      </div>

      <div class="step" id="step2">
        <button class="btn-back" id="backBtn">&larr; Back to login</button>
        <p class="code-label">We sent a 6-digit code to <strong id="codeEmailDisplay"></strong></p>
        <div class="code-inputs" id="codeInputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <div class="resend-row">
          <span id="resendTimer"></span>
          <button id="resendBtn" style="display:none;">Resend code</button>
        </div>
        <button class="btn-login" id="verifyBtn">
          <span class="btn-text">Verify &amp; Log In</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>
  </div>

<script src="scripts.js"></script>
<script src="login.js"></script>
</body>
</html>
